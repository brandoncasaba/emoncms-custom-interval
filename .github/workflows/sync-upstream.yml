name: Sync Emoncms from Home Assistant

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out custom integration
        uses: actions/checkout@v7

      - name: Ignore upstream checkout
        run: echo "/.upstream/" >> .git/info/exclude

      - name: Check out Home Assistant Core
        uses: actions/checkout@v7
        with:
          repository: home-assistant/core
          ref: dev
          path: .upstream/home-assistant-core
          sparse-checkout: |
            homeassistant/components/emoncms
          sparse-checkout-cone-mode: true

      - name: Sync integration
        run: python scripts/sync_upstream.py

      - name: Record upstream commit
        run: |
          git -C .upstream/home-assistant-core rev-parse HEAD > UPSTREAM_SHA

      - name: Validate files
        run: |
          test -f custom_components/emoncms/manifest.json
          test -f custom_components/emoncms/coordinator.py
          grep -q 'update_interval=timedelta(seconds=10)' \
            custom_components/emoncms/coordinator.py

      - name: Create sync pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/sync-emoncms
          delete-branch: true
          title: "Sync Emoncms integration from Home Assistant"
          commit-message: "Sync Emoncms integration from Home Assistant"
          body: |
            This PR synchronizes custom_components/emoncms
            with the upstream Home Assistant integration.

            The local 10-second polling override is reapplied by
            scripts/sync_upstream.py.

            Review upstream changes before merging.
          labels: |
            upstream-sync
            dependencies